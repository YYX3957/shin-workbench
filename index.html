<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小新工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="小新工作台">
<meta name="description" content="蜡笔小新风格的个人工作台：日历打卡、灵感笔记、变美计划、证书规划、服装搭配、奶茶摇一摇">
<meta name="theme-color" content="#E84C3D">
<meta name="background-color" content="#FFF1D6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<title>蜡笔小新工作台</title>
<style>
  :root{
    --shin-yellow:#FFD938;
    --shin-red:#E84C3D;
    --shin-brown:#7A4A2B;
    --shin-cream:#FFF1D6;
    --shin-pink:#FF9EAA;
    --shin-sky:#BFE3FF;
    --shin-mint:#B8E6C8;
    --shin-purple:#D9B8FF;
    --shin-orange:#FFB385;
    --ink:#3D2A1F;
    --paper:#FFFCF5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Comic Sans MS','Marker Felt','STXingkai','华文行楷','楷体','SimSun',cursive,sans-serif;
    background:var(--shin-cream);
    color:var(--ink);
    overflow:hidden;
    font-size:14px;
    background-image:
      radial-gradient(circle at 10% 20%,rgba(255,217,56,.15) 0%,transparent 25%),
      radial-gradient(circle at 90% 60%,rgba(232,76,61,.08) 0%,transparent 25%);
  }
  /* ====== 蜡笔质感通用 ====== */
  .candy-card{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:18px 22px 16px 24px / 22px 16px 24px 18px;
    box-shadow:4px 4px 0 var(--ink);
    position:relative;
  }
  .candy-btn{
    font-family:inherit;
    background:var(--shin-yellow);
    border:2.5px solid var(--ink);
    border-radius:14px 18px 12px 16px / 16px 12px 18px 14px;
    box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    font-size:14px;
    transition:transform .08s,box-shadow .08s;
  }
  .candy-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .candy-btn.red{background:var(--shin-red);color:#fff}
  .candy-btn.pink{background:var(--shin-pink)}
  .candy-btn.sky{background:var(--shin-sky)}
  .candy-btn.mint{background:var(--shin-mint)}
  .candy-btn.purple{background:var(--shin-purple)}
  .candy-btn.small{padding:4px 10px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
  .candy-btn.small:active{transform:translate(2px,2px);box-shadow:0 0}

  /* ====== 蜡笔小新风 CSS 图标库 ====== */
  .icon{width:24px;height:24px;display:inline-block;vertical-align:middle;position:relative;flex-shrink:0}
  .icon svg{width:100%;height:100%;overflow:visible}
  .nav-item .icon{width:26px;height:26px;margin-bottom:2px}

  /* ====== 布局 ====== */
  .app{display:flex;height:100%;width:100%}
  .sidebar{
    width:92px;flex-shrink:0;
    background:var(--shin-red);
    border-right:4px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;
    padding:12px 0 8px;
    gap:6px;
    overflow-y:auto;
    background-image:
      repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px);
  }
  .sidebar::-webkit-scrollbar{display:none}
  .nav-logo{
    width:58px;height:58px;
    background:var(--shin-yellow);
    border:3px solid var(--ink);
    border-radius:50%;
    box-shadow:3px 3px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    margin-bottom:4px;
    position:relative;
  }
  .nav-logo::after{
    content:'小新';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
    font-size:10px;color:#fff;background:var(--ink);padding:1px 6px;border-radius:8px;white-space:nowrap;
  }
  .nav-spacer{flex:1}
  .nav-item{
    width:74px;
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:16px 20px 14px 18px / 18px 14px 20px 16px;
    box-shadow:3px 3px 0 var(--ink);
    padding:8px 2px 6px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    cursor:pointer;
    transition:transform .08s,box-shadow .08s;
    text-align:center;
  }
  .nav-item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .nav-item .lbl{font-size:10px;line-height:1.1;color:var(--ink)}
  .nav-item.active{
    background:var(--shin-yellow);
    transform:translate(2px,2px);
    box-shadow:1px 1px 0 var(--ink);
  }
  .nav-item.active .lbl{font-weight:bold;font-size:11px}
  .nav-pct{
    width:74px;
    background:var(--shin-brown);
    border:2.5px solid var(--ink);
    border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);
    padding:6px 4px 8px;
    color:#fff;
    text-align:center;
  }
  .nav-pct .num{font-size:18px;line-height:1.1}
  .nav-pct .txt{font-size:10px;opacity:.9;margin-top:1px}
  .nav-pct .bar{
    height:5px;background:#fff3;border-radius:4px;margin-top:4px;overflow:hidden;
  }
  .nav-pct .bar i{display:block;height:100%;background:var(--shin-yellow);border-radius:4px;transition:width .4s}

  .main{flex:1;overflow-y:auto;padding:14px 16px 30px;position:relative}
  .main::-webkit-scrollbar{width:6px}
  .main::-webkit-scrollbar-thumb{background:var(--shin-brown);border-radius:6px}
  .main::-webkit-scrollbar-track{background:transparent}

  .page{display:none;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .page-title{
    font-size:24px;color:var(--shin-red);
    margin-bottom:4px;
    text-shadow:2px 2px 0 var(--shin-yellow);
    display:flex;align-items:center;gap:8px;
  }
  .page-title .icon{width:30px;height:30px}
  .page-sub{font-size:12px;color:#9a7a5a;margin-bottom:14px;padding-left:2px}

  /* ====== 日历组件 ====== */
  .cal-wrap{margin-bottom:18px}
  .cal-head{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--shin-yellow);
    border:2.5px solid var(--ink);
    border-radius:14px 18px 12px 16px / 16px 12px 18px 14px;
    box-shadow:3px 3px 0 var(--ink);
    padding:8px 12px;
    margin-bottom:10px;
  }
  .cal-head .ctitle{font-size:15px;display:flex;align-items:center;gap:6px}
  .cal-head .ctitle .icon{width:20px;height:20px}
  .cal-head .cmonth{font-size:13px;display:flex;gap:6px;align-items:center}
  .cal-head .cmonth button{
    font-family:inherit;background:var(--paper);border:2px solid var(--ink);
    border-radius:8px;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1;
  }
  .cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);
    padding:8px;
  }
  .cal-grid .dow{
    text-align:center;font-size:11px;color:var(--shin-brown);padding:4px 0;font-weight:bold;
  }
  .cal-grid .day{
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    border-radius:8px 10px 7px 9px / 9px 7px 10px 8px;
    cursor:pointer;
    position:relative;
    transition:background .1s;
  }
  .cal-grid .day.empty{cursor:default}
  .cal-grid .day:hover:not(.empty){background:#fff3}
  .cal-grid .day.today{outline:2px dashed var(--shin-red);outline-offset:-3px}
  .cal-grid .day.done{background:var(--shin-mint);font-weight:bold}
  .cal-grid .day.done::after{
    content:'★';position:absolute;top:1px;right:2px;font-size:8px;color:var(--shin-red);
  }
  .cal-grid .day.future{opacity:.45}
  .cal-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .cal-stat{
    flex:1;min-width:90px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:10px;
    box-shadow:2px 2px 0 var(--ink);
    padding:6px 8px;
    font-size:12px;
  }
  .cal-stat b{color:var(--shin-red);font-size:16px;display:block}

  .cal-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .cal-tab{
    font-family:inherit;font-size:12px;
    background:var(--paper);border:2px solid var(--ink);
    border-radius:10px;box-shadow:2px 2px 0 var(--ink);
    padding:4px 8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
  }
  .cal-tab.active{background:var(--shin-pink);font-weight:bold}
  .cal-tab .icon{width:14px;height:14px}
  .cal-tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%}

  /* ====== 灵感笔记 ====== */
  .note-input{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .note-input input[type=text]{
    flex:1;min-width:160px;
    font-family:inherit;font-size:14px;
    padding:8px 10px;
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:12px;
    box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);
  }
  .note-input select{
    font-family:inherit;font-size:13px;
    padding:8px 10px;
    background:var(--shin-sky);
    border:2.5px solid var(--ink);
    border-radius:12px;
    box-shadow:3px 3px 0 var(--ink);
    color:var(--ink);
  }
  .note-list{display:flex;flex-direction:column;gap:8px}
  .note-item{
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:14px 16px 12px 18px / 16px 12px 18px 14px;
    box-shadow:3px 3px 0 var(--ink);
    padding:10px 12px;
    position:relative;
  }
  .note-item .cat{
    display:inline-block;font-size:10px;
    padding:2px 8px;border-radius:8px;margin-right:6px;
    border:1.5px solid var(--ink);
    color:var(--ink);
  }
  .note-item .time{font-size:10px;color:#9a7a5a;display:block;margin-top:4px}
  .note-item .text{font-size:14px;word-break:break-all;margin-top:4px;line-height:1.5}
  .note-item .ops{position:absolute;top:6px;right:8px;display:flex;gap:4px}
  .note-item .ops button{
    font-family:inherit;font-size:11px;background:var(--shin-yellow);
    border:1.5px solid var(--ink);border-radius:6px;padding:2px 6px;cursor:pointer;
    box-shadow:1px 1px 0 var(--ink);
  }
  .note-empty{text-align:center;color:#bba;padding:30px;font-size:14px}

  /* ====== 穿搭 ====== */
  .outfit-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .outfit-tab{
    font-family:inherit;font-size:12px;
    background:var(--paper);border:2.5px solid var(--ink);
    border-radius:10px;box-shadow:2px 2px 0 var(--ink);
    padding:5px 9px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
  }
  .outfit-tab.active{background:var(--shin-purple);font-weight:bold}
  .outfit-tab .icon{width:14px;height:14px}
  .outfit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .outfit-card{
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);
    overflow:hidden;
  }
  .outfit-card .img{
    width:100%;aspect-ratio:3/4;background:#f0e8d8;display:block;object-fit:cover;
    border-bottom:2px solid var(--ink);
  }
  .outfit-card .img.placeholder{display:flex;align-items:center;justify-content:center;background:var(--shin-cream)}
  .outfit-card .img.placeholder .icon{width:42px;height:42px;opacity:.4}
  .outfit-card .body{padding:8px}
  .outfit-card .note{font-size:12px;word-break:break-all;line-height:1.4;min-height:16px}
  .outfit-card .date{font-size:10px;color:#9a7a5a;margin-top:4px}
  .outfit-card .del{
    font-family:inherit;font-size:11px;background:var(--shin-red);color:#fff;
    border:1.5px solid var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer;
    margin-top:6px;
  }
  .outfit-add{margin-top:10px}

  /* ====== 证书 ====== */
  .cert-countdown{
    color:#fff;
    border:2.5px solid var(--ink);border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);
    padding:8px 12px;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .cert-countdown .big{font-size:24px;background:var(--shin-yellow);color:var(--ink);
    padding:2px 10px;border-radius:10px;border:2px solid var(--ink);}
  .cert-card{
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:14px 16px 12px 18px / 16px 12px 18px 14px;
    box-shadow:3px 3px 0 var(--ink);
    padding:10px 12px;margin-bottom:12px;
  }
  .cert-card .h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .cert-card .name{font-size:14px;color:var(--shin-red);font-weight:bold}
  .cert-card .tag{font-size:10px;padding:2px 8px;border-radius:8px;border:1.5px solid var(--ink);background:var(--shin-yellow)}
  .cert-card .tag.opt{background:var(--shin-sky)}
  .cert-card .dd{font-size:12px;color:#9a7a5a;margin:4px 0}
  .cert-card .dd b{color:var(--shin-red);font-size:16px}

  .cet-banner{
    background:linear-gradient(135deg,var(--shin-sky),var(--shin-purple));
    border:2.5px solid var(--ink);border-radius:16px;
    box-shadow:3px 3px 0 var(--ink);
    padding:10px 14px;margin-bottom:14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .cet-banner .lbl{font-size:14px}
  .cet-banner .days{font-size:26px;color:var(--shin-red);text-shadow:1px 1px 0 #fff;font-weight:bold}

  /* ====== 奶茶 ====== */
  .tea-result{
    font-size:14px;text-align:center;padding:16px;
    background:#FFF6E0;border:2px dashed var(--ink);border-radius:12px;margin-bottom:10px;
  }
  .tea-result .big{font-size:22px;color:var(--shin-red);font-weight:bold;margin:6px 0;display:block}
  .tea-result .small{font-size:11px;color:#9a7a5a;margin-top:4px}

  /* ====== 弹窗 ====== */
  .modal-mask{
    position:fixed;inset:0;background:rgba(60,42,31,.5);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:16px;
  }
  .modal-mask.show{display:flex}
  .modal-box{
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:18px;
    box-shadow:5px 5px 0 var(--ink);
    padding:16px;
    max-width:380px;width:100%;
    max-height:80vh;overflow-y:auto;
  }
  .modal-box h3{color:var(--shin-red);margin-bottom:10px}
  .modal-box textarea{
    width:100%;min-height:80px;font-family:inherit;font-size:14px;
    padding:8px;background:#fff;border:2px solid var(--ink);border-radius:10px;
    box-shadow:2px 2px 0 var(--ink);resize:vertical;color:var(--ink);
  }
  .modal-box .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--shin-brown);color:#fff;
    padding:8px 16px;border-radius:12px;
    border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
    font-size:13px;z-index:100;
    opacity:0;transition:opacity .3s,bottom .3s;
    pointer-events:none;
  }
  .toast.show{opacity:1;bottom:30px}

  /* file input 用 inline style 隐藏，确保 label 触发可用 */

  .cat-study{background:var(--shin-sky)}
  .cat-life{background:var(--shin-mint)}
  .cat-outfit{background:var(--shin-purple)}
  .cat-exam{background:var(--shin-yellow)}
  .cat-other{background:var(--shin-pink)}

  @media (max-width:380px){
    .sidebar{width:84px}
    .nav-item{width:70px}
    .main{padding:10px 10px 30px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- 左侧导航 -->
  <nav class="sidebar">
    <div class="nav-logo">
      <svg viewBox="0 0 50 50" style="width:46px;height:46px">
        <!-- 脸 -->
        <circle cx="25" cy="25" r="20" fill="#FFD9A8" stroke="#3D2A1F" stroke-width="2"/>
        <!-- 头发 -->
        <path d="M7 20 Q15 5 25 8 Q35 5 43 20 Q43 12 38 8 Q30 3 25 5 Q20 3 12 8 Q7 12 7 20Z" fill="#7A4A2B"/>
        <!-- 眉毛 -->
        <rect x="13" y="18" width="9" height="3" rx="1.5" fill="#3D2A1F" transform="rotate(-8 13 18)"/>
        <rect x="28" y="18" width="9" height="3" rx="1.5" fill="#3D2A1F" transform="rotate(8 28 18)"/>
        <!-- 眼睛 -->
        <ellipse cx="16" cy="24" rx="1.6" ry="2.2" fill="#3D2A1F"/>
        <ellipse cx="34" cy="24" rx="1.6" ry="2.2" fill="#3D2A1F"/>
        <!-- 脸蛋 -->
        <ellipse cx="11" cy="30" rx="3.5" height="2.5" fill="#FF9EAA"/>
        <ellipse cx="39" cy="30" rx="3.5" height="2.5" fill="#FF9EAA"/>
        <!-- 嘴巴 -->
        <path d="M19 33 Q25 39 31 33 Q28 36 25 36 Q22 36 19 33Z" fill="#E84C3D" stroke="#3D2A1F" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="nav-item active" data-page="spark">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C8 2 6 5 7 9C7 10 7 11 6 12C5 13 5 15 6 16L8 16C8 19 9 21 12 22C15 21 16 19 16 16L18 16C19 15 19 13 18 12C17 11 17 10 17 9C18 5 16 2 12 2Z" fill="#FFD938" stroke="#3D2A1F" stroke-width="1.5"/>
          <rect x="11" y="14" width="2" height="6" rx="1" fill="#3D2A1F"/>
          <path d="M5 5L7 7M19 5L17 7M5 13L3 11M19 13L21 11" stroke="#FFD938" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="lbl">灵光一闪</span>
    </div>
    <div class="nav-item" data-page="sport">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="5" r="3" fill="#FFD9A8" stroke="#3D2A1F" stroke-width="1.5"/>
          <path d="M9 8 L8 14 L7 18 L9 18 L10 14 L11 18 L9 22" stroke="#E84C3D" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M15 8 L16 14 L17 18 L15 18 L14 14 L13 18 L15 22" stroke="#E84C3D" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M14 9 L20 12 L18 14 M10 9 L4 12 L6 14" stroke="#FFD9A8" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="lbl">运动打卡</span>
    </div>
    <div class="nav-item" data-page="english">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 3h10a4 4 0 0 1 4 4v14H8a4 4 0 0 1-4-4V3z" fill="#BFE3FF" stroke="#3D2A1F" stroke-width="1.5"/>
          <path d="M14 3v14a4 4 0 0 0 4 4" fill="#FFFCF5" stroke="#3D2A1F" stroke-width="1.5"/>
          <path d="M7 7h6M7 11h6" stroke="#3D2A1F" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="lbl">英语提升</span>
    </div>
    <div class="nav-item" data-page="cert">
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="9" r="5" fill="#FFD938" stroke="#3D2A1F" stroke-width="1.5"/>
          <path d="M12 9 L13.5 11 L16 11.5 L14 13 L14.5 16 L12 14.5 L9.5 16 L10 13 L8 11.5 L10.5 11Z" fill="#E84C3D"/>
          <path d="M9 12 L7 21 L10 19 L12 21 L14 19 L17 21 L15 12" fill="#BFE3FF" stroke="#3D2A1F" stroke-width="1.5"/>

function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function todayStr(){return fmtDate(new Date());}
function toast(msg){
  const t=document.getElementById('toast');

  window.__toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

  return Math.ceil((target-now)/86400000);
}

function getCalMonth(key){
  const now=new Date();
  const def=`${now.getFullYear()}-${now.getMonth()}`;
  if(!DB.calMonths[key]) DB.calMonths[key]=def;
  return DB.calMonths[key].split('-').map(Number);
}
function setCalMonth(key,y,m){
  DB.calMonths[key]=`${y}-${m}`;
  renderAll();
}
function toggleCheck(taskId,date){
  ensureKey(taskId);
  if(DB.checks[taskId][date]) delete DB.checks[taskId][date];
  else DB.checks[taskId][date]=true;
  save(); renderAll();
}
function isChecked(taskId,date){ return DB.checks[taskId] && DB.checks[taskId][date]; }
function weekRate(taskId){
  const now=new Date();
  const day=now.getDay()||7;
  const monday=new Date(now); monday.setDate(now.getDate()-day+1); monday.setHours(0,0,0,0);
  let cnt=0;
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    if(d>now) break;
    if(isChecked(taskId,fmtDate(d))) cnt++;
  }
  const passed=Math.min(day,7);
  return passed?Math.round(cnt/passed*100):0;
}
function monthRate(taskId){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth();
  const daysPassed=now.getDate();
  let cnt=0;
  for(let d=1;d<=daysPassed;d++) if(isChecked(taskId,fmtDate(new Date(y,m,d)))) cnt++;
  return {done:cnt,passed:daysPassed,rate:Math.round(cnt/daysPassed*100)};
}
function todayTotalRate(){
  const all=[
    ...SPORT_TASKS,...ENGLISH_TASKS,...BEAUTY_TASKS,
    ...CERTS.map(c=>({id:c.id})),
    {id:'outfit_daily'}
  ];
  let done=0;
  all.forEach(t=>{ if(isChecked(t.id,todayStr())) done++; });
  return Math.round(done/all.length*100);
}

function ico(t){
  return `<span class="icon" style="width:14px;height:14px">${ICONS[t]||ICONS.book}</span>`;
}
function icoLg(t){
  return `<span class="icon" style="width:22px;height:22px">${ICONS[t]||ICONS.book}</span>`;
}

function renderCal(key,taskId,opts={}){
  const [y,m]=getCalMonth(key);
  const first=new Date(y,m,1);
  const startDow=first.getDay()||7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=todayStr();
  const now=new Date();
  let html=`<div class="cal-head">
    <div class="ctitle">${opts.title||''}</div>
    <div class="cmonth">
      <button onclick="setCalMonth('${key}',${m===0?y-1:y},${m===0?11:m-1})">‹</button>
      <span>${y}年${m+1}月</span>
      <button onclick="setCalMonth('${key}',${m===11?y+1:y},${m===11?0:m+1})">›</button>
    </div>
  </div>`;
  html+=`<div class="cal-grid">`;
  ['一','二','三','四','五','六','日'].forEach(d=>html+=`<div class="dow">${d}</div>`);
  for(let i=1;i<startDow;i++) html+=`<div class="day empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=fmtDate(new Date(y,m,d));
    const done=isChecked(taskId,dateStr);
    const isToday=dateStr===today;
    const future=new Date(y,m,d)>now && !isToday;
    html+=`<div class="day ${done?'done':''} ${isToday?'today':''} ${future?'future':''}" onclick="${future?'':`toggleCheck('${taskId}','${dateStr}')`}">${d}</div>`;
  }
  html+=`</div>`;
  const wr=weekRate(taskId);
  const mr=monthRate(taskId);
  html+=`<div class="cal-stats">
    <div class="cal-stat">本周完成率<br><b>${wr}%</b></div>
    <div class="cal-stat">本月进度<br><b>${mr.done}/${mr.passed}天</b></div>
    <div class="cal-stat">月完成率<br><b>${mr.rate}%</b></div>
  </div>`;
  return html;
}

function renderMultiCal(containerId, tasks, keyPrefix){
  const wrap=document.getElementById(containerId);
  if(!wrap.dataset.active) wrap.dataset.active=tasks[0].id;
  const active=wrap.dataset.active;
  const task=tasks.find(t=>t.id===active);
  let tabs=`<div class="cal-tabs">`;
  tasks.forEach(t=>{
    tabs+=`<div class="cal-tab ${t.id===active?'active':''}" onclick="document.getElementById('${containerId}').dataset.active='${t.id}';renderAll()">
      ${ico(t.ico)} ${t.name}
    </div>`;
  });
  tabs+=`</div>`;
  wrap.innerHTML=tabs+renderCal(keyPrefix+'_'+active, active, {title:`${icoLg(task.ico)} ${task.name}`});
}

// === 奶茶 ===
function rollTea(){
  const t=TEA_POOL[Math.floor(Math.random()*TEA_POOL.length)];
  document.getElementById('teaResult').innerHTML=`<div style="font-size:12px;color:#9a7a5a">今天就喝</div><span class="big">${t}</span><div class="small">甜甜的一天开始啦～</div>`;
}
function addTeaLike(){
  const html=document.getElementById('teaResult').innerHTML;
  if(!html.includes('big')){ toast('先摇一杯再收藏嘛～');return; }
  const m=html.match(/<span class="big">[^<]+<\/span>/);
  if(!m)return;
  const name=m[0].replace(/<[^>]+>/g,'');
  if(DB.teas.some(x=>x.name===name)){toast('已经收藏过啦 ❤️');return;}
  DB.teas.unshift({id:Date.now(),name,time:new Date().toISOString()});
  save();renderTeas();toast('加入奶茶收藏 ❤️');
}
function delTea(id){ DB.teas=DB.teas.filter(t=>t.id!==id); save();renderTeas(); }
function renderTeas(){
  const wrap=document.getElementById('teaList');
  if(!DB.teas.length){
    wrap.innerHTML=`<div class="note-empty" style="padding:14px">还没有收藏的奶茶～</div>`;
    return;
  }
  wrap.innerHTML=DB.teas.map(t=>{
    const d=new Date(t.time);
    return `<div class="note-item" style="padding:8px 10px">
      <div class="ops"><button onclick="delTea(${t.id})">删除</button></div>
      <span class="cat cat-other">收藏</span>
      <div class="text">${t.name}</div>
      <span class="time">${d.getMonth()+1}/${d.getDate()} 收藏</span>
    </div>`;
  }).join('');
}

// === 弹窗 ===
let modalCb=null;
function openModal(title,bodyHtml,cb){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHtml;
  modalCb=cb;
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){
  document.getElementById('modalMask').classList.remove('show');
  modalCb=null;
}
document.getElementById('modalOk').addEventListener('click',()=>{
  if(modalCb){
    const r=modalCb();
    if(r!==false) closeModal();
  }else closeModal();
});
document.getElementById('modalMask').addEventListener('click',e=>{
  if(e.target.id==='modalMask')closeModal();
});
document.getElementById('sparkText').addEventListener('keydown',e=>{
  if(e.key==='Enter')addSpark();
});

renderAll();

// === PWA：注册 Service Worker ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// === "添加到主屏幕"提示 ===
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(()=>showInstallTip(), 3000);
});

function showInstallTip(){
  if(document.getElementById('installTip')) return;
  const tip=document.createElement('div');
  tip.id='installTip';
  tip.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:90%;background:#FFD938;color:#3D2A1F;padding:10px 14px;border:2.5px solid #3D2A1F;border-radius:14px 18px 12px 16px / 16px 12px 18px 14px;box-shadow:3px 3px 0 #3D2A1F;font-size:13px;z-index:200;display:flex;align-items:center;gap:10px';
  tip.innerHTML=`
    <span style="font-size:18px">📲</span>
    <span style="flex:1">把工作台装到桌面吧～蜡笔小新随时陪你打卡！</span>
    <button id="installBtn" style="font-family:inherit;background:#E84C3D;color:#fff;border:2px solid #3D2A1F;border-radius:8px;padding:4px 10px;cursor:pointer;box-shadow:1px 1px 0 #3D2A1F">安装</button>
    <button id="closeTip" style="font-family:inherit;background:#FFFCF5;color:#3D2A1F;border:2px solid #3D2A1F;border-radius:8px;padding:4px 8px;cursor:pointer;box-shadow:1px 1px 0 #3D2A1F">×</button>
  `;
  document.body.appendChild(tip);
  document.getElementById('installBtn').onclick = async () => {
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      tip.remove();
    } else {
      alert('iOS 用法：\n点 Safari 底部分享按钮 ⬆\n选 "添加到主屏幕"\n蜡笔小新工作台就装上啦～');
    }
  };
  document.getElementById('closeTip').onclick = () => tip.remove();
}
</script>
